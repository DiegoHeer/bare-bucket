name: publish

# Two entry points:
# - workflow_dispatch with push=true, on a release tag ref — the normal
#   release path, dispatched by release-please.yml (its GITHUB_TOKEN-created
#   tag push can't trigger `on: push: tags` directly; dispatch events are
#   exempt from that suppression).
# - workflow_dispatch with push=false (default) — dry-run: build + smoke,
#   skip login/push (spec §6).
# The `on: push: tags` trigger stays as a belt-and-braces path for manually
# pushed tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to GHCR (requires running on a vX.Y.Z tag ref)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      PUSH_ENABLED: ${{ github.event_name == 'push' || inputs.push == true }}
    steps:
      # The v* trigger is a loose glob and dispatch can run on any ref;
      # whenever a push is intended, require an exact semver release tag so a
      # stray ref can't clobber `latest` with a non-release build.
      - name: Validate release tag is semver
        if: env.PUSH_ENABLED == 'true'
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::push requested but ref is not a semver release tag: $GITHUB_REF"; exit 1; }

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build a single-arch copy locally and smoke it BEFORE any push.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: smoke:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --rm --name smoke -p 8080:8080 smoke:local
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          WASM=$(docker exec smoke sh -c 'ls /usr/share/nginx/html/assets | grep "\.wasm$"' | head -1)
          test -n "$WASM"
          curl -fsS -o /dev/null "http://127.0.0.1:8080/assets/$WASM"
          # The .mjs pdf.js worker previously regressed to application/octet-stream
          # (fixed in nginx.conf) — pin the content-type here so a future base-image
          # bump can't silently reintroduce it.
          MJS=$(docker exec smoke sh -c 'ls /usr/share/nginx/html/assets | grep "\.mjs$"' | head -1)
          test -n "$MJS"
          curl -fsS -o /dev/null "http://127.0.0.1:8080/assets/$MJS"
          curl -fsSI "http://127.0.0.1:8080/assets/$MJS" | grep -qiE 'content-type: (application|text)/javascript'
          docker stop smoke

      - uses: docker/login-action@v3
        if: env.PUSH_ENABLED == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: env.PUSH_ENABLED == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/diegoheer/bare-bucket-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Bare Bucket (web)
            org.opencontainers.image.description=Serverless S3-compatible file manager — web client
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push (multi-arch)
        if: env.PUSH_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
