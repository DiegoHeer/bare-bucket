name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags created by release-please use GITHUB_TOKEN, and GitHub suppresses
  # workflow triggers for GITHUB_TOKEN-caused events — so the tag push never
  # fires publish.yml's `on: push: tags` trigger. workflow_dispatch is one of
  # the documented exceptions to that suppression, so we dispatch the publish
  # workflow explicitly on the release tag.
  trigger-publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch publish workflow on the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ needs.release-please.outputs.tag_name }}" \
            -f push=true
