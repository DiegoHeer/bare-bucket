server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The base image's mime.types predates .mjs; without this the pdf.js
    # module worker is served as application/octet-stream, which browsers
    # reject for module workers (and gzip_types never matches it). A bare
    # `types { }` block here would REPLACE the inherited table (breaking
    # .wasm/.html), so the fix lives in a dedicated location instead:
    # mime.types has no .mjs entry, so default_type applies.
    location ~* ^/assets/.+\.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml;

    # Hashed build artifacts: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry document must always revalidate so deploys take effect.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
